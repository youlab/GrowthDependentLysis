[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "GrowthLysis"
version = "0.1.0"
description = "Data analysis"
authors = [
  { name = "Pak Lun Kevin Cheung", email = "pcheung4@wisc.edu" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "notebook",
    "numpyro",
    "scipy==1.15.0",
    "pandas==2.3.2",
    "matplotlib==3.10.6",
    "scikit-learn==1.7.1",
    "seaborn==0.13.2",
    "jupyterlab==4.3.3",
    "tqdm==4.66.4",
    "pillow==10.4.0",
    "h5py==3.12.1",
    "jax[cpu]==0.6.2",
    "flax==0.11.2",
]
